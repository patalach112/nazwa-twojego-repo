name: Game server reports

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  report-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pekora_reporting_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pekora_reporting_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pekora_reporting_tests
      GAME_SERVER_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=pekora_reporting_tests;Username=postgres;Password=postgres
      GAME_SERVER_TEST_REDIS: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install migration dependencies
        working-directory: api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test every migration and reporting schema rollback
        working-directory: api
        run: npm run test:migrations
      - name: Test HTTP reports against Postgres and Redis
        run: dotnet test Roblox/Roblox.GameServer.Test/Roblox.GameServer.Test.csproj --configuration Release --logger "console;verbosity=normal"
