name: Game arbiter

on:
  push:
    branches: [master]
    paths:
      - game-arbiter/**
      - .github/workflows/arbiter.yml
  pull_request:
    branches: [master]
    paths:
      - game-arbiter/**
      - .github/workflows/arbiter.yml

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the arbiter contract without RCC
        working-directory: game-arbiter
        run: npm test
