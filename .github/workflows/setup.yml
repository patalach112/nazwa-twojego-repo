name: Setup scripts

on:
  push:
    branches: [master]
    paths:
      - scripts/setup.sh
      - scripts/test_setup.py
      - Roblox/Roblox.Website/*.example.json
      - game-arbiter/config.example.json
      - game-server/config.example.json
      - frontend/util/create_config.js
      - .github/workflows/setup.yml
  pull_request:
    branches: [master]
    paths:
      - scripts/setup.sh
      - scripts/test_setup.py
      - Roblox/Roblox.Website/*.example.json
      - game-arbiter/config.example.json
      - game-server/config.example.json
      - frontend/util/create_config.js
      - .github/workflows/setup.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check shell syntax
        run: bash -n scripts/setup.sh
      - name: Test generated configs and existing-file preservation
        run: python3 -m unittest discover -s scripts -p test_setup.py -v
